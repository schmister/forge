name: Build Commander APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install old Maven
        run: |
          curl -O https://archive.apache.org/dist/maven/maven-3/3.8.1/binaries/apache-maven-3.8.1-bin.tar.gz
          tar xf apache-maven-3.8.1-bin.tar.gz
          echo "$PWD/apache-maven-3.8.1/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=$PWD/apache-maven-3.8.1" >> "$GITHUB_ENV"

            - name: Set up Android tools
        run: |
          JAVA_HOME=${JAVA_HOME_17_X64} ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --root=${ANDROID_SDK_ROOT} --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Install Android Maven plugin
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -L -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -L -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom
          mvn install:install-file \
            -Dfile=android-maven-plugin-4.6.2.jar \
            -DgroupId=com.simpligility.maven.plugins \
            -DartifactId=android-maven-plugin \
            -Dversion=4.6.2 \
            -Dpackaging=jar
          cd -
          mvn install -Dmaven.test.skip=true
          mvn dependency:tree

      - name: Build Android APK
        run: |
          export DISPLAY=:1
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B -P android-test-build verify \
            -f ./forge-gui-android/pom.xml \
            -Dandroid.sdk.path=$ANDROID_SDK_ROOT \
            -Dandroid.buildToolsVersion=35.0.0 \
            -Dmaven.test.skip=true

      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Commander-Android-APK
          path: |
            **/target/*.apk
            **/target/**/*.apk
          if-no-files-found: error